  #   env_file:
  #     - .env
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     - redis

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  rmqtt:
    image: docker.io/rmqtt/rmqtt:latest
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/rmqtt/rmqtt.toml:/app/rmqtt/rmqtt.toml:Z
      - ./deploy/rmqtt/plugins/rmqtt-session-storage.toml:/app/rmqtt/rmqtt-plugins/rmqtt-session-storage.toml:Z
      - ./deploy/rmqtt/plugins/rmqtt-message-storage.toml:/app/rmqtt/rmqtt-plugins/rmqtt-message-storage.toml:Z
      - ./deploy/rmqtt/plugins/rmqtt-web-hook.toml:/app/rmqtt/rmqtt-plugins/rmqtt-web-hook.toml:Z
      - ./deploy/rmqtt/hook.log:/var/log/rmqtt/hook.log:Z
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"


