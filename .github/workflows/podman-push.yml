name: Build and Push Docker Image

on: [push]

jobs:
  build:
    # This triggers your runner label 'ubuntu-24.04:docker://node:24-bookworm'
    runs-on: personal-macbook

    steps:
      - name: Checkout Code
        uses: https://code.forgejo.org/actions/checkout@v4

      # Log into Codeberg Registry (or Docker Hub) if pushing
      - name: Log into Codeberg Registry
        uses: https://code.forgejo.org/actions/docker-login@v1
        with:
          registry: codeberg.org
          username: ${{ secrets.CODEBERG_USERNAME }}
          password: ${{ secrets.CODEBERG_TOKEN }}

      # Set up Buildx (No duplicate mount error anymore!)
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      # Test the build
      - name: Build and Push
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: codeberg.org/${{ github.repository }}/my-app:latest